<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>لوحة التحكم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">BP</div>
    <div class="eyebrow">ADMIN PANEL</div>
    <h1>لوحة التحكم</h1>
    <p class="login-subtitle">تسجيل الدخول للوصول إلى نظام إدارة الحسابات</p>
    <form id="loginForm">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
      <button class="btn primary full" type="submit">تسجيل الدخول</button>
      <div id="loginError" class="form-error"></div>
    </form>
    <div class="login-footer">نظام إدارة الحسابات</div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark small">BP</div>
      <div><strong>لوحة التحكم</strong><span>إدارة الحسابات</span></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-action="home">⌂ <span>الرئيسية</span></button>
      <button class="nav-item" data-action="create">＋ <span>فتح حساب</span></button>
      <button class="nav-item" data-action="deposit">＋ <span>زيادة رصيد</span></button>
      <button class="nav-item" data-action="users">☷ <span>المستخدمون</span></button>
      <button class="nav-item" data-action="search">⌕ <span>بحث حساب</span></button>
      <button class="nav-item" data-action="block">⊘ <span>حظر حساب</span></button>
      <button class="nav-item" data-action="activate">✓ <span>تفعيل حساب</span></button>
      <button class="nav-item" data-action="withdraw">↙ <span>سحب رصيد</span></button>
      <button class="nav-item" data-action="bulk">⇄ <span>شحن جماعي</span></button>
      <button class="nav-item danger-link" data-action="delete">⌫ <span>حذف حساب</span></button>
      <button class="nav-item danger-link" data-action="zero">0 <span>تصفير الأرصدة</span></button>
    </nav>
    <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
    <div class="sidebar-footer">تم التصميم والبرمجة بواسطة بوص</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn">☰</button>
      <div><div class="topbar-title">مرحباً بك</div><div class="topbar-subtitle">إدارة الحسابات والعمليات</div></div>
      <div class="topbar-status"><i></i> متصل</div>
    </header>
    <div id="content" class="content"></div>
  </main>
</section>
<script src="script.js"></script>
</body>
</html>
