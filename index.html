<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم نسخة روان</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- شاشة تسجيل الدخول -->
<section id="loginScreen" class="screen">

    <div class="login-card">

        <div class="logo">
            لوحة التحكم نسخة روان
        </div>

        <div class="login-subtitle">
            لوحة تحكم تجريبية
        </div>

        <label>كلمة المرور</label>

        <input
            id="passwordInput"
            type="password"
            placeholder="أدخل كلمة المرور"
        >

        <button class="login-button" onclick="login()">
            تسجيل الدخول
        </button>

        <div id="loginError" class="error"></div>

        <div class="footer">
            تم التصميم والبرمجة بواسطة روان
        </div>

    </div>

</section>


<!-- لوحة التحكم -->
<section id="appScreen" class="screen hidden">

    <div class="dashboard">

        <header>

            <h1>
                لوحة التحكم نسخة روان
            </h1>

            <div class="status">
                وضع تجريبي
            </div>

        </header>


        <!-- الأزرار -->

        <div class="buttons-grid">

            <button class="control blue" onclick="openPanel('create')">
                فتح حساب جديد
            </button>

            <button class="control green" onclick="openPanel('deposit')">
                زيادة رصيد المستخدم
            </button>

            <button class="control red" onclick="openPanel('block')">
                حظر حساب
            </button>

            <button class="control purple" onclick="openPanel('activate')">
                تفعيل حساب
            </button>

            <button class="control orange" onclick="openPanel('users')">
                عرض المستخدمين
            </button>

            <button class="control pink" onclick="openPanel('delete')">
                حذف حساب
            </button>

            <button class="control cyan" onclick="openPanel('bulk')">
                شحن جماعي
            </button>

            <button class="control violet" onclick="openPanel('zero')">
                تصفير الأرصدة
            </button>

            <button class="control brown" onclick="openPanel('search')">
                بحث حساب
            </button>

            <button class="control teal" onclick="openPanel('withdraw')">
                سحب رصيد
            </button>

        </div>


        <!-- منطقة العمليات -->

        <div id="panel" class="panel">

            <h2>
                مرحباً بك
            </h2>

            <p>
                اختر إحدى العمليات من الأعلى.
            </p>

        </div>


        <div class="footer">
            تم التصميم والبرمجة بواسطة روان
        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
